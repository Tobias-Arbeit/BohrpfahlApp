<dialog id="pasteDlg" aria-labelledby="pasteTitle">
  <div class="dlg-head">
    <h2 id="pasteTitle">Text einfügen</h2>
    <button type="button" class="icon-btn" data-close aria-label="Schließen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="dlg-body">
    <p class="sub" id="pasteHint" style="margin-top:0"></p>
    <textarea id="pasteArea" rows="12" style="width:100%;font-family:ui-monospace,Consolas,monospace;font-size:11.5px;resize:vertical"></textarea>
    <div id="pasteMsgs" class="msgs" aria-live="polite"></div>
  </div>
  <div class="dlg-foot">
    <button type="button" class="btn" data-close>Schließen</button>
    <button type="button" class="btn primary" id="pasteCopyBtn" hidden>In Zwischenablage kopieren</button>
    <button type="button" class="btn primary" id="pasteSubmitBtn" hidden>Übernehmen</button>
  </div>
</dialog>
